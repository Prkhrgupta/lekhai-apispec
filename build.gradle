plugins {
    id 'java-library'        // IMPORTANT: use this instead of 'java'
    id 'maven-publish'
}

group = 'in.lekhai'
version = file('VERSION').text.trim()

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

sourceSets {
    main {
        java {
            srcDirs = ['generated/spring/src/main/java']
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    api platform('org.springframework.boot:spring-boot-dependencies:3.2.5')
    api 'org.springframework:spring-web'
    api 'org.springframework:spring-context'
    api 'jakarta.validation:jakarta.validation-api'
    api 'jakarta.annotation:jakarta.annotation-api'

    api 'io.swagger.core.v3:swagger-annotations:2.2.21'
    api 'org.openapitools:jackson-databind-nullable:0.2.6'
    api 'org.springframework.data:spring-data-commons'
    api 'org.springdoc:springdoc-openapi-starter-common:2.5.0'
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java

            groupId = project.group
            artifactId = 'lekhaiapispec'
            version = project.version
        }
    }
    repositories {
        maven {
            name = 'Reposilite'
            url = 'https://mavenrepo.sitswiftcloud.in/releases'

            credentials {
                // This automatically pulls from your ~/.gradle/gradle.properties first,
                // and falls back to environment variables in your GitHub Actions CI/CD
                username = project.findProperty('reposiliteUser') ?: System.getenv('REPOSILITE_USER')
                password = project.findProperty('reposilitePassword') ?: System.getenv('REPOSILITE_PASSWORD')
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}