SalesInvoiceStatus:
  type: string
  enum: [ACTIVE, CANCELLED]

SalesInvoiceSupplyType:
  type: string
  description: Auto-classified; B2CL = inter-state to unregistered above 1,00,000, otherwise B2CS.
  enum: [B2B, B2CL, B2CS]

PlaceOfSupplySource:
  type: string
  description: Where the resolved place_of_supply came from.
  enum: [REQUEST, LEDGER]

SalesInvoiceTaxType:
  type: string
  enum: [CGST, SGST, IGST, CESS]

SalesInvoiceWarningCode:
  type: string
  enum: [SERIES_GAP, NEGATIVE_STOCK]

SalesInvoiceItemRequest:
  type: object
  required: [stock_item_id, quantity, rate]
  properties:
    stock_item_id:
      type: integer
      format: int64
    quantity:
      type: number
      format: double
      description: Quantity in the stock item's primary UOM. Must be > 0.
      example: 120.0
    rate:
      type: number
      format: double
      description: Unit rate (defaults on the UI to the item's sale price). Must be >= 0.
      example: 250.0
    discount_pct:
      type: number
      format: double
      minimum: 0
      maximum: 100
      default: 0
      example: 5.0

SalesInvoiceRequest:
  type: object
  description: >-
    Request body shared by create and preview. TODO: broker / transport /
    vehicle / e-way bill details are intentionally absent and will be added as
    an optional object once the EWB table exists.
  required: [series_code, bill_date, party_ledger_id, items]
  properties:
    series_code:
      type: string
      description: SALES custom voucher series code (mandatory).
      example: GST
    bill_no:
      type: integer
      format: int64
      nullable: true
      description: Optional manual bill number. When absent the series allocates the next one.
    bill_date:
      type: string
      format: date
      example: '2026-11-04'
    party_ledger_id:
      type: integer
      format: int64
      description: Debtor or cash ledger.
    place_of_supply:
      type: string
      nullable: true
      description: >-
        2-digit GST state code. Optional; falls back to the party ledger's
        state. 422 when neither is available.
      example: '27'
    sale_ledger_id:
      type: integer
      format: int64
      nullable: true
      description: >-
        Optional. If sent, must be a configured sale ledger; otherwise ignored
        in v1 (sale ledger is still resolved per line by sale type + GST rate).
    ship_to_id:
      type: integer
      format: int64
      nullable: true
      description: >-
        Null means ship-to is the same as the party's billing address.
        TODO: refers to a ship-to address table that does not exist yet; a
        non-null value currently returns 422.
    remarks:
      type: string
      nullable: true
    items:
      type: array
      minItems: 1
      items:
        $ref: '#/SalesInvoiceItemRequest'

SalesInvoiceParty:
  type: object
  description: Frozen party snapshot taken at invoice time.
  properties:
    ledger_id:
      type: integer
      format: int64
    name:
      type: string
    gstin:
      type: string
      nullable: true
    address:
      type: string
      nullable: true
    state_code:
      type: string
      nullable: true

SalesInvoiceItemResult:
  type: object
  properties:
    line_no:
      type: integer
      format: int32
    stock_item_id:
      type: integer
      format: int64
    item_name:
      type: string
    hsn_code:
      type: string
      nullable: true
    category_name:
      type: string
      nullable: true
    uom_id:
      type: integer
      format: int64
    uom_code:
      type: string
    quantity:
      type: number
      format: double
    rate:
      type: number
      format: double
    gross_amount:
      type: number
      format: double
    discount_pct:
      type: number
      format: double
    discount_amount:
      type: number
      format: double
    taxable_amount:
      type: number
      format: double
    gst_rate:
      type: number
      format: double
    cess_rate:
      type: number
      format: double
    cgst_amount:
      type: number
      format: double
    sgst_amount:
      type: number
      format: double
    igst_amount:
      type: number
      format: double
    cess_amount:
      type: number
      format: double
    line_total:
      type: number
      format: double
    sale_ledger_id:
      type: integer
      format: int64
      description: Resolved sale ledger snapshot (ledger.id).

SalesInvoiceTaxLine:
  type: object
  description: Tax rollup row, one per (tax_type, rate).
  properties:
    tax_type:
      $ref: '#/SalesInvoiceTaxType'
    rate:
      type: number
      format: double
    taxable_amount:
      type: number
      format: double
    amount:
      type: number
      format: double
    tax_ledger_id:
      type: integer
      format: int64

SalesInvoiceTotals:
  type: object
  properties:
    total_pcs:
      type: number
      format: double
      description: Sum of quantities of lines whose UOM is Pcs (cloth-shop v1).
    goods_amount:
      type: number
      format: double
    discount_amount:
      type: number
      format: double
    taxable_amount:
      type: number
      format: double
    cgst_amount:
      type: number
      format: double
    sgst_amount:
      type: number
      format: double
    igst_amount:
      type: number
      format: double
    cess_amount:
      type: number
      format: double
    total_add_charges:
      type: number
      format: double
      description: Always 0 in v1 (deferred).
    round_off:
      type: number
      format: double
      description: Signed; positive means net was rounded up.
    net_amount:
      type: number
      format: double

SalesInvoiceWarning:
  type: object
  properties:
    code:
      $ref: '#/SalesInvoiceWarningCode'
    message:
      type: string
    stock_item_id:
      type: integer
      format: int64
      nullable: true

SalesInvoiceResponse:
  type: object
  description: Full frozen snapshot of the created invoice. Reused by the later detail endpoint.
  properties:
    id:
      type: integer
      format: int64
    voucher_id:
      type: integer
      format: int64
    status:
      $ref: '#/SalesInvoiceStatus'
    series_id:
      type: integer
      format: int64
    series_code:
      type: string
    bill_no:
      type: integer
      format: int64
    bill_display:
      type: string
      example: GST/43/25-26
    financial_year:
      type: string
      example: 2025-26
    bill_date:
      type: string
      format: date
    supply_type:
      $ref: '#/SalesInvoiceSupplyType'
    place_of_supply:
      type: string
    place_of_supply_source:
      $ref: '#/PlaceOfSupplySource'
    is_inter_state:
      type: boolean
    ship_to_id:
      type: integer
      format: int64
      nullable: true
    remarks:
      type: string
      nullable: true
    party:
      $ref: '#/SalesInvoiceParty'
    items:
      type: array
      items:
        $ref: '#/SalesInvoiceItemResult'
    taxes:
      type: array
      items:
        $ref: '#/SalesInvoiceTaxLine'
    totals:
      $ref: '#/SalesInvoiceTotals'
    warnings:
      type: array
      items:
        $ref: '#/SalesInvoiceWarning'
    created_at:
      type: string
      format: date-time
      description: UTC

SalesInvoicePreviewResponse:
  type: object
  description: >-
    Computed, non-persisted view. bill_no / bill_display are the next number
    (peek only, not reserved).
  properties:
    series_code:
      type: string
    bill_no:
      type: integer
      format: int64
    bill_display:
      type: string
    financial_year:
      type: string
    supply_type:
      $ref: '#/SalesInvoiceSupplyType'
    place_of_supply:
      type: string
    place_of_supply_source:
      $ref: '#/PlaceOfSupplySource'
    is_inter_state:
      type: boolean
    party:
      $ref: '#/SalesInvoiceParty'
    items:
      type: array
      items:
        $ref: '#/SalesInvoiceItemResult'
    taxes:
      type: array
      items:
        $ref: '#/SalesInvoiceTaxLine'
    totals:
      $ref: '#/SalesInvoiceTotals'
    warnings:
      type: array
      items:
        $ref: '#/SalesInvoiceWarning'

StockAvailabilityResponse:
  type: object
  properties:
    stock_item_id:
      type: integer
      format: int64
    item_name:
      type: string
    uom_id:
      type: integer
      format: int64
    uom_code:
      type: string
    opening_qty:
      type: number
      format: double
    total_in:
      type: number
      format: double
    total_out:
      type: number
      format: double
    available_qty:
      type: number
      format: double
      description: opening_qty + total_in - total_out
