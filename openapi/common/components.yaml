Error:
  type: object
  properties:
    success:
      type: boolean
      example: false
    message:
      type: string
      example: null
    data:
      type: object
    error:
      type: string
      example: "Unexpected error"
    timestamp:
      type: string
      format: date-time

SeriesFyMissingError:
  type: object
  description: >-
    Structured SERIES_FY_MISSING error returned when no custom voucher-series
    row exists for the requested voucher_type + financial_year — either a
    series list filtered by financial_year that matches zero rows, or a
    voucher create carrying a series_code with no matching series row.
    Follows the shared Error envelope with the machine-readable code in
    error and the missing voucher_type/financial_year echoed in data for
    actionable UI messaging.
  properties:
    success:
      type: boolean
      example: false
    message:
      type: string
      example: "No voucher series configured for voucher_type SALES in financial year 2025-26"
    data:
      type: object
      description: Missing series context echoed for actionable handling
      properties:
        voucher_type:
          type: string
          example: "SALES"
        financial_year:
          type: string
          example: "2025-26"
    error:
      type: string
      example: "SERIES_FY_MISSING"
    timestamp:
      type: string
      format: date-time

DropdownItem:
  type: object
  required:
    - label
  properties:
    id:
      type: integer
      format: int64
      description: Unique identifier for the dropdown option
      example: 1
    label:
      type: string
      description: Display text for the dropdown option
      example: "Option 1"
    code:
      type: string
      description: generic Unique identifier, if id is not applicable
      example: "JP"

Format:
  type: string
  enum:
    - EXCEL
    - PDF
    - CSV
  description: Output format for downloadable content

PaginationMeta:
  type: object
  properties:
    totalPages:
      type: integer
      format: int32
    totalElements:
      type: integer
      format: int64
    page:
      type: integer
      format: int32
    size:
      type: integer
      format: int32

responses:
  UnauthorizedError:
    description: Access token is missing or invalid
    content:
      application/json:
        schema:
          $ref: '#/Error'
  ForbiddenError:
    description: User is not authorized to perform this action
    content:
      application/json:
        schema:
          $ref: '#/Error'
  NotFoundError:
    description: Resource not found
    content:
      application/json:
        schema:
          $ref: '#/Error'
  InternalServerError:
    description: Internal server error
    content:
      application/json:
        schema:
          $ref: '#/Error'
  SeriesFyMissingError:
    description: No voucher series row configured for the requested voucher_type and financial_year filter; returned when a financial_year filter matches no configured row, or when a voucher create carries a series_code with no matching series row
    content:
      application/json:
        schema:
          $ref: '#/SeriesFyMissingError'
