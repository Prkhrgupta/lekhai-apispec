VoucherEntry:
  type: object
  properties:
    account_id:
      type: integer
      format: int64
    amount:
      type: number
    remarks:
      type: string

PaymentVoucherRequest:
  type: object
  properties:
    voucher_date:
      type: string
      format: date
    payment_account_id:
      type: integer
      format: int64
    narration:
      type: string
    series_code:
      type: string
      description: >-
        Optional custom voucher-series code (e.g. CASH-1) scoping bill
        numbering for voucher type PAYMENT and the voucher's financial year.
        Absent = legacy counter behavior (backward compatible); present with
        absent bill_no = auto-allocate the next running number; present with
        bill_no = manual entry (backend checks the series'
        allow_manual_entry flag). An unknown series_code, or no series row
        for the voucher_type + financial_year, returns 422 SERIES_FY_MISSING.
      example: "CASH-1"
    bill_no:
      type: integer
      format: int64
      nullable: true
      description: >-
        Optional manual running bill number within series_code. Only
        meaningful with series_code present; the backend rejects manual
        numbers when the series disallows manual entry. Absent with
        series_code present = auto-allocate.
      example: 43
    items:
      type: array
      items:
        $ref: '#/VoucherEntry'

