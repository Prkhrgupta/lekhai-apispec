paths:
  /payment-voucher:
    post:
      tags: [Voucher]
      summary: Create payment voucher
      operationId: createPaymentVoucher
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../voucher/components.yaml#/PaymentVoucherRequest'
      responses:
        '200':
          description: >-
            Payment voucher created. When series_code is supplied, numbering
            follows the custom voucher series (auto-allocate when bill_no is
            absent, manual when present and allowed); the response may carry
            warnings.first_missing_bill_no (UI toasts "Bill no X is
            missing"). An unknown series_code, or no series row for the
            voucher_type + financial_year, returns 422 SERIES_FY_MISSING.
          content:
            application/json:
              schema:
                $ref: '../voucher/components.yaml#/VoucherResponse'
        '401':
          $ref: '../common/components.yaml#/responses/UnauthorizedError'
        '403':
          $ref: '../common/components.yaml#/responses/ForbiddenError'
        '422':
          $ref: '../common/components.yaml#/responses/SeriesFyMissingError'
        '500':
          $ref: '../common/components.yaml#/responses/InternalServerError'
