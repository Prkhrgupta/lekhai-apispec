AreaRequest:
  type: object
  required: [areaName]
  properties:
    areaName:
      type: string
      example: Kanpur

AreaResponse:
  type: object
  properties:
    id:
      type: integer
      format: int64
    areaName:
      type: string
      example: Kanpur

AreaSearchableField:
  type: string
  enum: [NAME]

AreaSummaryPageResponse:
  type: object
  properties:
    data:
      type: array
      items:
        $ref: '#/AreaResponse'
    pagination:
      $ref: '../../common/components.yaml#/PaginationMeta'