paths:
  /area:
    post:
      tags: [Area]
      summary: Create area
      operationId: createArea
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../area/components.yaml#/AreaRequest'
      responses:
        '201':
          description: Area created
          content:
            application/json:
              schema:
                $ref: '../area/components.yaml#/AreaResponse'
        '401':
          $ref: '../../common/components.yaml#/responses/UnauthorizedError'
        '403':
          $ref: '../../common/components.yaml#/responses/ForbiddenError'
        '500':
          $ref: '../../common/components.yaml#/responses/InternalServerError'
    get:
      tags: [Area]
      summary: get Area options for dropdown
      operationId: getAreaDropdownOptions
      responses:
        '200':
          description: Dropdown options for area
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../../common/components.yaml#/DropdownItem'
        '401':
          $ref: '../../common/components.yaml#/responses/UnauthorizedError'
        '403':
          $ref: '../../common/components.yaml#/responses/ForbiddenError'
        '500':
          $ref: '../../common/components.yaml#/responses/InternalServerError'
  /area/summary:
    get:
      tags: [Area]
      summary: Get area summary
      operationId: getAreaSummaries
      x-spring-paginated: true
      parameters:
        - name: page
          in: query
          description: Zero-based page index
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
          required: false
        - name: size
          in: query
          description: Number of records per page
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
          required: false
        - name: sort
          in: query
          description: Sorting criteria in the format property(,asc|desc)
          schema:
            type: array
            items:
              type: string
          required: false
          explode: true
        - name: searchableField
          in: query
          description: Field to search by
          schema:
            $ref: '../area/components.yaml#/AreaSearchableField'
          required: false
        - name: searchText
          in: query
          description: Search query text
          schema:
            type: string
          required: false
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '../area/components.yaml#/AreaSummaryPageResponse'
        '401':
          $ref: '../../common/components.yaml#/responses/UnauthorizedError'
        '403':
          $ref: '../../common/components.yaml#/responses/ForbiddenError'
        '500':
          $ref: '../../common/components.yaml#/responses/InternalServerError'