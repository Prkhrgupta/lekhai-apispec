SaleType:
  type: string
  enum: [IN_STATE, OUT_STATE, EXPORT_WITH_IGST, EXPORT_UNDER_LUT, SEZ_WITH_IGST, SEZ_UNDER_LUT]
  description: >
    Place-of-supply classification. IN_STATE posts CGST + SGST; OUT_STATE and the
    *_WITH_IGST types post IGST; *_UNDER_LUT types are zero-rated and post no tax.

SaleLedgerSettingRequest:
  type: object
  required: [saleLedgerId, saleType]
  properties:
    saleLedgerId:
      type: integer
      format: int64
      description: Sale ledger account this configuration belongs to
    saleType:
      $ref: '#/SaleType'
    taxability:
      $ref: '../../common/components.yaml#/GstTaxability'
    gstRate:
      type: number
      format: double
      default: 0.0
      description: >
        Total GST rate. The CGST/SGST/IGST split is derived by the server from
        saleType and taxability.
    cgstLedgerId:
      type: integer
      format: int64
    sgstLedgerId:
      type: integer
      format: int64
    igstLedgerId:
      type: integer
      format: int64
    cessPercentage:
      type: number
      format: double
      default: 0.0
    cessLedgerId:
      type: integer
      format: int64
    freightPackingLedgerId:
      type: integer
      format: int64
    roundOffLedgerId:
      type: integer
      format: int64

SaleLedgerSettingResponse:
  type: object
  properties:
    id:
      type: integer
      format: int64
    saleLedgerId:
      type: integer
      format: int64
    saleLedgerName:
      type: string
    saleType:
      $ref: '#/SaleType'
    taxability:
      $ref: '../../common/components.yaml#/GstTaxability'
    gstRate:
      type: number
      format: double
    cgstPercentage:
      type: number
      format: double
      description: Derived from gstRate (read-only)
    cgstLedgerId:
      type: integer
      format: int64
    cgstLedgerName:
      type: string
    sgstPercentage:
      type: number
      format: double
      description: Derived from gstRate (read-only)
    sgstLedgerId:
      type: integer
      format: int64
    sgstLedgerName:
      type: string
    igstPercentage:
      type: number
      format: double
      description: Derived from gstRate (read-only)
    igstLedgerId:
      type: integer
      format: int64
    igstLedgerName:
      type: string
    cessPercentage:
      type: number
      format: double
    cessLedgerId:
      type: integer
      format: int64
    cessLedgerName:
      type: string
    freightPackingLedgerId:
      type: integer
      format: int64
    freightPackingLedgerName:
      type: string
    roundOffLedgerId:
      type: integer
      format: int64
    roundOffLedgerName:
      type: string

SaleLedgerSettingSearchableField:
  type: string
  enum: [SALE_LEDGER_NAME]

SaleLedgerSettingSummaryPageResponse:
  type: object
  properties:
    data:
      type: array
      items:
        $ref: '#/SaleLedgerSettingResponse'
    pagination:
      $ref: '../../common/components.yaml#/PaginationMeta'
