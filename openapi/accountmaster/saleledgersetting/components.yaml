SaleType:
  type: string
  enum: [IN_STATE, OUT_STATE, EXPORT]

SaleLedgerSettingRequest:
  type: object
  required: [saleLedgerId]
  properties:
    saleLedgerId:
      type: integer
      format: int64
      description: Sale ledger account this configuration belongs to
    saleType:
      $ref: '#/SaleType'
    gstRate:
      type: number
      format: double
      default: 0.0
    cgstLedgerId:
      type: integer
      format: int64
    sgstLedgerId:
      type: integer
      format: int64
    igstLedgerId:
      type: integer
      format: int64

SaleLedgerSettingResponse:
  type: object
  properties:
    id:
      type: integer
      format: int64
    saleLedgerId:
      type: integer
      format: int64
    saleLedgerName:
      type: string
    saleType:
      $ref: '#/SaleType'
    gstRate:
      type: number
      format: double
    cgstLedgerId:
      type: integer
      format: int64
    cgstLedgerName:
      type: string
    sgstLedgerId:
      type: integer
      format: int64
    sgstLedgerName:
      type: string
    igstLedgerId:
      type: integer
      format: int64
    igstLedgerName:
      type: string

SaleLedgerSettingSummaryPageResponse:
  type: object
  properties:
    data:
      type: array
      items:
        $ref: '#/SaleLedgerSettingResponse'
    pagination:
      $ref: '../../common/components.yaml#/PaginationMeta'
