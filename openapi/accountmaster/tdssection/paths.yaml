paths:
  /tds-section:
    get:
      tags: [TdsSection]
      summary: get TDS section (nature of payment) options for dropdown
      operationId: getTdsSectionDropdownOptions
      responses:
        '200':
          description: Dropdown options for TDS sections; code holds the section code (e.g. 194Q)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../../common/components.yaml#/DropdownItem'
        '401':
          $ref: '../../common/components.yaml#/responses/UnauthorizedError'
        '403':
          $ref: '../../common/components.yaml#/responses/ForbiddenError'
        '500':
          $ref: '../../common/components.yaml#/responses/InternalServerError'
