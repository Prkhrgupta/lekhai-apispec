PurchaseType:
  type: string
  enum: [IN_STATE, OUT_STATE, EXPORT]

PurchaseLedgerSettingRequest:
  type: object
  required: [purchaseLedgerId]
  properties:
    purchaseLedgerId:
      type: integer
      format: int64
      description: Purchase ledger account this configuration belongs to
    purchaseType:
      $ref: '#/PurchaseType'
    gstRate:
      type: number
      format: double
      default: 0.0
    cgstPercentage:
      type: number
      format: double
      default: 0.0
    cgstLedgerId:
      type: integer
      format: int64
    sgstPercentage:
      type: number
      format: double
      default: 0.0
    sgstLedgerId:
      type: integer
      format: int64
    igstPercentage:
      type: number
      format: double
      default: 0.0
    igstLedgerId:
      type: integer
      format: int64
    cessPercentage:
      type: number
      format: double
      default: 0.0
    cessLedgerId:
      type: integer
      format: int64
    freightPackingLedgerId:
      type: integer
      format: int64
    roundOffLedgerId:
      type: integer
      format: int64
    tdsPercentage:
      type: number
      format: double
      default: 0.0
    tdsLedgerId:
      type: integer
      format: int64

