  type: object
  properties:
    id:
      type: integer
      format: int64
    purchaseLedgerId:
      type: integer
      format: int64
    purchaseLedgerName:
      type: string
    purchaseType:
      $ref: '#/PurchaseType'
    gstRate:
      type: number
      format: double
    cgstPercentage:
      type: number
      format: double
    cgstLedgerId:
      type: integer
      format: int64
    cgstLedgerName:
      type: string
    sgstPercentage:
      type: number
      format: double
    sgstLedgerId:
      type: integer
      format: int64
    sgstLedgerName:
      type: string
    igstPercentage:
      type: number
      format: double
    igstLedgerId:
      type: integer
      format: int64
    igstLedgerName:
      type: string
    cessPercentage:
      type: number
      format: double
    cessLedgerId:
      type: integer
      format: int64
    cessLedgerName:
      type: string
    freightPackingLedgerId:
      type: integer
      format: int64
    freightPackingLedgerName:
      type: string
    roundOffLedgerId:
      type: integer
      format: int64
