PurchaseType:
  type: string
  enum: [IN_STATE, OUT_STATE, IMPORT, SEZ]
  description: >
    Place-of-supply classification. IN_STATE posts CGST + SGST; OUT_STATE, IMPORT
    (IGST paid on the bill of entry) and SEZ post IGST.

ItcEligibility:
  type: string
  enum: [ELIGIBLE, BLOCKED_17_5, INELIGIBLE]
  description: >
    Whether input tax on these purchases can be claimed. BLOCKED_17_5 is credit
    blocked under section 17(5) of the CGST Act; for blocked or ineligible credit
    the tax becomes part of the purchase cost.

PurchaseLedgerSettingRequest:
  type: object
  required: [purchaseLedgerId, purchaseType]
  properties:
    purchaseLedgerId:
      type: integer
      format: int64
      description: Purchase ledger account this configuration belongs to
    purchaseType:
      $ref: '#/PurchaseType'
    taxability:
      $ref: '../../common/components.yaml#/GstTaxability'
    itcEligibility:
      $ref: '#/ItcEligibility'
    reverseCharge:
      type: boolean
      default: false
      description: >
        Purchases under reverse charge (e.g. goods transport agency, notified goods
        from unregistered suppliers). Requires the RCM payable ledgers.
    gstRate:
      type: number
      format: double
      default: 0.0
      description: >
        Total GST rate. The CGST/SGST/IGST split is derived by the server from
        purchaseType and taxability.
    cgstLedgerId:
      type: integer
      format: int64
    sgstLedgerId:
      type: integer
      format: int64
    igstLedgerId:
      type: integer
      format: int64
    cessPercentage:
      type: number
      format: double
      default: 0.0
    cessLedgerId:
      type: integer
      format: int64
    rcmCgstPayableLedgerId:
      type: integer
      format: int64
    rcmSgstPayableLedgerId:
      type: integer
      format: int64
    rcmIgstPayableLedgerId:
      type: integer
      format: int64
    freightPackingLedgerId:
      type: integer
      format: int64
    roundOffLedgerId:
      type: integer
      format: int64

