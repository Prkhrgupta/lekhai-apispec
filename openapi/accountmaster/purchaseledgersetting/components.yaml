PurchaseType:
  type: string
  enum: [IN_STATE, OUT_STATE, EXPORT]

PurchaseLedgerSettingRequest:
  type: object
  required: [purchaseLedgerId]
  properties:
    purchaseLedgerId:
      type: integer
      format: int64
      description: Purchase ledger account this configuration belongs to
    purchaseType:
      $ref: '#/PurchaseType'
    gstRate:
      type: number
      format: double
      default: 0.0
    cgstLedgerId:
      type: integer
      format: int64
    sgstLedgerId:
      type: integer
      format: int64
    igstLedgerId:
      type: integer
      format: int64
    cessPercentage:
      type: number
      format: double
      default: 0.0
    cessLedgerId:
      type: integer
      format: int64

PurchaseLedgerSettingResponse:
  type: object
  properties:
    id:
      type: integer
      format: int64
    purchaseLedgerId:
      type: integer
      format: int64
    purchaseLedgerName:
      type: string
    purchaseType:
      $ref: '#/PurchaseType'
    gstRate:
      type: number
      format: double
    cgstLedgerId:
      type: integer
      format: int64
    cgstLedgerName:
      type: string
    sgstLedgerId:
      type: integer
      format: int64
    sgstLedgerName:
      type: string
    igstLedgerId:
      type: integer
      format: int64
    igstLedgerName:
      type: string
    cessPercentage:
      type: number
      format: double
    cessLedgerId:
      type: integer
      format: int64
    cessLedgerName:
      type: string

PurchaseLedgerSettingSummaryPageResponse:
  type: object
  properties:
    data:
      type: array
      items:
        $ref: '#/PurchaseLedgerSettingResponse'
    pagination:
      $ref: '../../common/components.yaml#/PaginationMeta'
