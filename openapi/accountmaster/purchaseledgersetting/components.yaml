      type: integer
      format: int64
    purchaseLedgerId:
      type: integer
      format: int64
    purchaseLedgerName:
      type: string
    purchaseType:
      $ref: '#/PurchaseType'
    taxability:
      $ref: '../../common/components.yaml#/GstTaxability'
    itcEligibility:
      $ref: '#/ItcEligibility'
    reverseCharge:
      type: boolean
    gstRate:
      type: number
      format: double
    cgstPercentage:
      type: number
      format: double
      description: Derived from gstRate (read-only)
    cgstLedgerId:
      type: integer
      format: int64
    cgstLedgerName:
      type: string
    sgstPercentage:
      type: number
      format: double
      description: Derived from gstRate (read-only)
    sgstLedgerId:
      type: integer
      format: int64
    sgstLedgerName:
      type: string
    igstPercentage:
      type: number
      format: double
      description: Derived from gstRate (read-only)
    igstLedgerId:
      type: integer
      format: int64
    igstLedgerName:
      type: string
    cessPercentage:
      type: number
      format: double
    cessLedgerId:
      type: integer
      format: int64
    cessLedgerName:
      type: string
    rcmCgstPayableLedgerId:
      type: integer
      format: int64
    rcmCgstPayableLedgerName:
      type: string
    rcmSgstPayableLedgerId:
      type: integer
      format: int64
    rcmSgstPayableLedgerName:
      type: string
    rcmIgstPayableLedgerId:
      type: integer
      format: int64
    rcmIgstPayableLedgerName:
      type: string
    freightPackingLedgerId:
      type: integer
      format: int64
    freightPackingLedgerName:
      type: string
    roundOffLedgerId:
      type: integer
      format: int64
    roundOffLedgerName:
      type: string

PurchaseLedgerSettingSearchableField:
  type: string
  enum: [PURCHASE_LEDGER_NAME]

PurchaseLedgerSettingSummaryPageResponse:
