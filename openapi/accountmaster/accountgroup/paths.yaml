paths:
  /account-group:
    post:
      tags: [Account Group]
      summary: Create account group
      operationId: createAccountGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../accountgroup/components.yaml#/AccountGroupRequest'
      responses:
        '200':
          description: Account group created
          content:
            application/json:
              schema:
                $ref: '../accountgroup/components.yaml#/AccountGroupResponse'
        '401':
          $ref: '../../common/components.yaml#/responses/UnauthorizedError'
        '403':
          $ref: '../../common/components.yaml#/responses/ForbiddenError'
        '500':
          $ref: '../../common/components.yaml#/responses/InternalServerError'
    get:
      tags: [Account Group]
      summary: Get account group options for a dropdown
      operationId: getAccountGroupDropdownOptions
      responses:
        '200':
          description: Dropdown options for account groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../../common/components.yaml#/DropdownItem'
        '401':
          $ref: '../../common/components.yaml#/responses/UnauthorizedError'
        '403':
          $ref: '../../common/components.yaml#/responses/ForbiddenError'
        '500':
          $ref: '../../common/components.yaml#/responses/InternalServerError'
  /account-group/summary:
    get:
      tags: [Account Group]
      summary: Get account group summary
      operationId: getAccountGroupSummaries
      x-spring-paginated: true
      parameters:
        - name: page
          in: query
          description: Zero-based page index
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
          required: false
        - name: size
          in: query
          description: Number of records per page
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
          required: false
        - name: sort
          in: query
          description: Sorting criteria in the format property(,asc|desc)
          schema:
            type: array
            items:
              type: string
          required: false
          explode: true
        - name: searchableField
          in: query
          description: Field to search by
          schema:
            $ref: '../accountgroup/components.yaml#/AccountGroupSearchableField'
          required: false
        - name: searchText
          in: query
          description: Search query text
          schema:
            type: string
          required: false
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '../accountgroup/components.yaml#/AccountGroupSummaryPageResponse'
        '401':
          $ref: '../../common/components.yaml#/responses/UnauthorizedError'
        '403':
          $ref: '../../common/components.yaml#/responses/ForbiddenError'
        '500':
          $ref: '../../common/components.yaml#/responses/InternalServerError'
