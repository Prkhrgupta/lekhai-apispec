AccountGroupRequest:
  type: object
  required: [name, parentId]
  properties:
    name:
      type: string
      example: Fixed Assets
    parentId:
      type: integer
      format: int64
      example: 5

AccountGroupResponse:
  type: object
  properties:
    id:
      type: integer
      format: int64
    name:
      type: string
      example: Sundry Creditor

AccountGroupSummaryItem:
  type: object
  properties:
    id:
      type: integer
      format: int64
    name:
      type: string

AccountGroupSearchableField:
  type: string
  enum: [NAME]

AccountGroupSummaryPageResponse:
  type: object
  properties:
    data:
      type: array
      items:
        $ref: '#/AccountGroupSummaryItem'
    pagination:
      $ref: '../../common/components.yaml#/PaginationMeta'
