paths:
  /ledger:
    post:
      tags: [Ledger]
      summary: Create ledger
      operationId: createLedger
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../ledger/components.yaml#/LedgerRequest'
      responses:
        '200':
          description: Ledger created
          content:
            application/json:
              schema:
                $ref: '../ledger/components.yaml#/LedgerResponse'
        '401':
          $ref: '../../common/components.yaml#/responses/UnauthorizedError'
        '403':
          $ref: '../../common/components.yaml#/responses/ForbiddenError'
        '500':
          $ref: '../../common/components.yaml#/responses/InternalServerError'
    get:
      tags: [Ledger]
      summary: List all ledgers
      operationId: listLedgers
      responses:
        '200':
          description: List of ledgers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../ledger/components.yaml#/LedgerResponse'
        '401':
          $ref: '../../common/components.yaml#/responses/UnauthorizedError'
        '403':
          $ref: '../../common/components.yaml#/responses/ForbiddenError'
        '500':
          $ref: '../../common/components.yaml#/responses/InternalServerError'
  /ledger/{id}:
    get:
      tags: [Ledger]
      summary: Get ledger by ID
      operationId: getLedger
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Ledger details
          content:
            application/json:
              schema:
                $ref: '../ledger/components.yaml#/LedgerResponse'
        '401':
          $ref: '../../common/components.yaml#/responses/UnauthorizedError'
        '403':
          $ref: '../../common/components.yaml#/responses/ForbiddenError'
        '500':
          $ref: '../../common/components.yaml#/responses/InternalServerError'
    put:
      tags: [Ledger]
      summary: Update ledger
      operationId: updateLedger
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../ledger/components.yaml#/LedgerRequest'
      responses:
        '200':
          description: Ledger updated
          content:
            application/json:
              schema:
                $ref: '../ledger/components.yaml#/LedgerResponse'
        '401':
          $ref: '../../common/components.yaml#/responses/UnauthorizedError'
        '403':
          $ref: '../../common/components.yaml#/responses/ForbiddenError'
        '500':
          $ref: '../../common/components.yaml#/responses/InternalServerError'
  /ledger/summary:
    get:
      tags: [Ledger]
      summary: Get ledger summary
      operationId: getLedgerSummaries
      x-spring-paginated: true
      parameters:
        - name: page
          in: query
          description: Zero-based page index
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
          required: false
        - name: size
          in: query
          description: Number of records per page
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
          required: false
        - name: sort
          in: query
          description: Sorting criteria in the format property(,asc|desc)
          schema:
            type: array
            items:
              type: string
          required: false
          explode: true
        - name: searchableField
          in: query
          description: Field to search/sort by
          schema:
            $ref: '../ledger/components.yaml#/LedgerSearchableField'
          required: false
        - name: searchText
          in: query
          description: Search query text
          schema:
            type: string
          required: false
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '../ledger/components.yaml#/LedgerSummaryPageResponse'
        '401':
          $ref: '../../common/components.yaml#/responses/UnauthorizedError'
        '403':
          $ref: '../../common/components.yaml#/responses/ForbiddenError'
        '500':
          $ref: '../../common/components.yaml#/responses/InternalServerError'
