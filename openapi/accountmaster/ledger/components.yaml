parameter:
  AccountGroupFilter:
    name: underAccountGroups
    in: query
    required: false
    schema:
      type: array
      items:
        type: integer
        format: int64
    style: form
    explode: true
    example: [5]

AccountEntryType:
  type: string
  enum: [DR, CR]

RegistrationType:
  type: string
  enum: [COMPOSITION, CUSTOMER, REGULAR, UNREGISTERED]

PartyType:
  type: string
  enum: [NOT_APPLICABLE, DEEMED_EXPORT, GOVERNMENT_ENTITY, SEZ]

DeducteeType:
  type: string
  enum: [INDIVIDUAL_HUF, OTHERS]
  description: Deductee status; some TDS sections (e.g. 194C) apply a different rate to individuals/HUFs

LedgerRequest:
  type: object
  required: [name]
  properties:
    gst_in_number:
      type: string
    name:
      type: string
    account_group:
      type: integer
      format: int64
    opening_balance:
      type: number
    account_entry_type:
      $ref: '#/AccountEntryType'
    legal_name:
      type: string
    Location:
      type: string
    country_name:
      type: string
    state_and_code:
      type: string
    mail_to:
      $ref: '#/MailTo'
    area_id:
      type: integer
      format: int64
    contact_person:
      type: string
    phone_number:
      type: integer
      format: int64
    pan:
      type: string
    credit_limit:
      type: number
    transport_id:
      type: integer
      format: int64
    tan_number:
      type: string
    broker_id:
      type: integer
      format: int64
    gstInDetailsPresent:
      type: boolean
    gst_in_details:
      $ref: '#/GstInDetail'
    aadhaar_number:
      type: string
    image_uploaded:
      type: boolean
    email:
      type: string
    msme_number:
      type: string
    distance:
      type: number
      format: double
    pin_code:
      type: string
    city:
      type: string
    tds_applicable:
      type: boolean
      default: false
      description: Whether TDS is deducted on payments/credits to this party
    tds_section_id:
      type: integer
      format: int64
      description: Default TDS section (nature of payment) for this party
    deductee_type:
      $ref: '#/DeducteeType'
    ldc_certificate_number:
      type: string
      description: Lower/nil deduction certificate number
    ldc_rate:
      type: number
      format: double
      description: TDS rate allowed by the lower deduction certificate
    ldc_valid_from:
      type: string
      format: date
    ldc_valid_to:
      type: string
      format: date

MailTo:
  type: object
  properties:
    mail_to_line_1:
      type: string
    mail_to_line_2:
      type: string
    mail_to_line_3:
      type: string

GstInDetail:
  type: object
  properties:
    registration_type:
      $ref: '#/RegistrationType'
    is_e_commerce_operator:
      type: boolean
    gst_in_uin:
      type: string
    party_type:
      $ref: '#/PartyType'

LedgerResponse:
  type: object
  properties:
    id:
      type: integer
      format: int64
    name:
      type: string
    legal_name:
      type: string
    account_group_id:
      type: integer
      format: int64
    opening_balance:
      type: number
    opening_balance_type:
      $ref: '#/AccountEntryType'
    credit_limit:
      type: number
    pan:
      type: string
    aadhaar:
      type: string
    tan:
      type: string
    email:
      type: string
    msme:
      type: string
    contact_person:
      type: string
    phone_number:
      type: integer
      format: int64
    gst_in_number:
      type: string
    location:
      type: string
    is_active:
      type: boolean
    area:
      $ref: '#/LedgerArea'
    broker:
      $ref: '#/LedgerBroker'
    transport:
      $ref: '#/LedgerTransport'
    gstin_details:
      $ref: '#/GstInDetailResponse'
    address:
      $ref: '#/LedgerAddress'
    tds_applicable:
      type: boolean
    tds_section_id:
      type: integer
      format: int64
    tds_section_label:
      type: string
    deductee_type:
      $ref: '#/DeducteeType'
    ldc_certificate_number:
      type: string
    ldc_rate:
      type: number
      format: double
    ldc_valid_from:
      type: string
      format: date
    ldc_valid_to:
      type: string
      format: date
    created_at:
      type: string
      format: date-time

LedgerAddress:
  type: object
  properties:
    address_line_1:
      type: string
    address_line_2:
      type: string
    address_line_3:
      type: string
    city:
      type: string
    state_id:
      type: string
    area_id:
      type: integer
      format: int64
    pincode:
      type: string
    distance:
      type: number

LedgerArea:
  type: object
  properties:
    id:
      type: integer
      format: int64
    name:
      type: string
    state_code:
      type: string

LedgerBroker:
  type: object
  properties:
    id:
      type: integer
      format: int64
    name:
      type: string
    phone:
      type: string

LedgerTransport:
  type: object
  properties:
    id:
      type: integer
      format: int64
    name:
      type: string
    phone:
      type: string
    gst:
      type: string

GstInDetailResponse:
  type: object
  properties:
    registration_type:
      $ref: '#/RegistrationType'
    is_e_commerce_operator:
      type: boolean
    gst_in_uin:
      type: string
    party_type:
      $ref: '#/PartyType'

LedgerBalanceResponse:
  type: object
  properties:
    ledger_id:
      type: integer
      format: int64
    current_balance:
      type: number
    current_balance_type:
      $ref: '#/AccountEntryType'
    debit_amount:
      type: number
    credit_amount:
      type: number

LedgerSummaryItem:
  type: object
  properties:
    id:
      type: integer
      format: int64
    name:
      type: string
    state:
      type: string
    area:
      type: string
    accountGroup:
      type: string
    gstin:
      type: string

LedgerSearchableField:
  type: string
  enum: [NAME, AREA]

LedgerSummaryPageResponse:
  type: object
  properties:
    data:
      type: array
      items:
        $ref: '#/LedgerSummaryItem'
    pagination:
      $ref: '../../common/components.yaml#/PaginationMeta'
