paths:
  /account-books/interest-calculation/product-basis:
    get:
      tags: [InterestCalculation]
      summary: Get Product Basis Interest Calculation report
      operationId: getProductBasisInterest
      parameters:
        - name: ledgerId
          in: query
          required: true
          schema:
            type: integer
            format: int64
        - name: fromDate
          in: query
          schema:
            type: string
            format: date
        - name: toDate
          in: query
          schema:
            type: string
            format: date
        - name: calculationType
          in: query
          schema:
            type: string
            enum: [YEARLY, MONTHLY]
            default: YEARLY
        - name: interestRate
          in: query
          schema:
            type: number
            default: 12.0
        - name: includeOpeningInterest
          in: query
          schema:
            type: number
            default: 0.0
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: './components.yaml#/ProductBasisInterestResponse'
        '401':
          $ref: '../../common/components.yaml#/responses/UnauthorizedError'
        '403':
          $ref: '../../common/components.yaml#/responses/ForbiddenError'
        '500':
          $ref: '../../common/components.yaml#/responses/InternalServerError'

  /account-books/interest-calculation/date-wise:
    get:
      tags: [InterestCalculation]
      summary: Get Date-wise Interest Account report
      operationId: getDateWiseInterest
      parameters:
        - name: ledgerId
          in: query
          required: true
          schema:
            type: integer
            format: int64
        - name: firstDrDate
          in: query
          schema:
            type: string
            format: date
        - name: lastDrDate
          in: query
          schema:
            type: string
            format: date
        - name: firstCrDate
          in: query
          schema:
            type: string
            format: date
        - name: lastCrDate
          in: query
          schema:
            type: string
            format: date
        - name: graceDays
          in: query
          schema:
            type: integer
            default: 0
        - name: yearlyRate
          in: query
          schema:
            type: number
            default: 24.0
        - name: asOnDate
          in: query
          schema:
            type: string
            format: date
        - name: includeOpening
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: './components.yaml#/DateWiseInterestResponse'
        '401':
          $ref: '../../common/components.yaml#/responses/UnauthorizedError'
        '403':
          $ref: '../../common/components.yaml#/responses/ForbiddenError'
        '500':
          $ref: '../../common/components.yaml#/responses/InternalServerError'

  /account-books/interest-calculation/manual:
    post:
      tags: [InterestCalculation]
      summary: Calculate manual interest entries
      operationId: calculateManualInterest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components.yaml#/ManualInterestCalculateRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: './components.yaml#/ManualInterestResponse'
        '401':
          $ref: '../../common/components.yaml#/responses/UnauthorizedError'
        '403':
          $ref: '../../common/components.yaml#/responses/ForbiddenError'
        '500':
          $ref: '../../common/components.yaml#/responses/InternalServerError'
