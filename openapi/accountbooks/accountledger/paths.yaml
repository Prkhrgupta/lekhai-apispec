paths:
  /account-ledger/{ledgerId}:
    get:
      tags: [AccountLedger]
      summary: Get account ledger entries
      operationId: getAccountLedgerEntries
      x-spring-paginated: true
      parameters:
        - name: ledgerId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: page
          in: query
          description: Zero-based page index
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
          required: false
        - name: size
          in: query
          description: Number of records per page
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
          required: false
        - name: sort
          in: query
          description: Sorting criteria in the format property(,asc|desc)
          schema:
            type: array
            items:
              type: string
          required: false
          explode: true
        - name: fromDate
          in: query
          description: Filter entries from this date (inclusive)
          schema:
            type: string
            format: date
          required: false
        - name: toDate
          in: query
          description: Filter entries up to this date (inclusive)
          schema:
            type: string
            format: date
          required: false
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '../accountledger/components.yaml#/AccountLedgerPageResponse'
        '401':
          $ref: '../../common/components.yaml#/responses/UnauthorizedError'
        '403':
          $ref: '../../common/components.yaml#/responses/ForbiddenError'
        '500':
          $ref: '../../common/components.yaml#/responses/InternalServerError'
