paths:
  /account-books/trial-balance:
    get:
      tags: [TrialBalance]
      summary: Get Trial Balance report
      operationId: getTrialBalance
      parameters:
        - name: fromDate
          in: query
          description: Financial period from date (inclusive)
          schema:
            type: string
            format: date
          required: false
        - name: toDate
          in: query
          description: Financial period to date (inclusive)
          schema:
            type: string
            format: date
          required: false
        - name: format
          in: query
          description: Report format (SUMMARY or DETAIL)
          schema:
            type: string
            enum: [SUMMARY, DETAIL]
            default: SUMMARY
          required: false
        - name: withNilBalance
          in: query
          description: Whether to include accounts with nil/zero balance
          schema:
            type: boolean
            default: false
          required: false
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: './components.yaml#/TrialBalanceResponse'
        '401':
          $ref: '../../common/components.yaml#/responses/UnauthorizedError'
        '403':
          $ref: '../../common/components.yaml#/responses/ForbiddenError'
        '500':
          $ref: '../../common/components.yaml#/responses/InternalServerError'
