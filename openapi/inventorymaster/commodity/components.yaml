CommodityRequest:
  type: object
  required: [name]
  properties:
    name:
      type: string
    hsn_sac_code:
      type: string
    description:
      type: string
      description: Description for GSTR-1 / Eway Bill
    gst_rate:
      type: number
      format: double
    cess_percentage:
      type: number
      format: double
      default: 0.0
    unit_of_measurement:
      type: string

CommodityResponse:
  type: object
  properties:
    id:
      type: integer
      format: int64
    name:
      type: string
    hsn_sac_code:
      type: string
    description:
      type: string
      description: Description for GSTR-1 / Eway Bill
    gst_rate:
      type: number
      format: double
    cess_percentage:
      type: number
      format: double
      default: 0.0
    unit_of_measurement:
      type: string
    is_active:
      type: boolean
    created_at:
      type: string
      format: date-time

CommoditySummaryResponse:
  type: object
  properties:
    columns:
      type: array
      items:
        $ref: '#/CommoditySummaryColumn'
    data:
      type: array
      items:
        $ref: '#/CommoditySummaryItem'
    pagination:
      $ref: '../../common/components.yaml#/PaginationMeta'

CommoditySummaryColumn:
  type: object
  properties:
    name:
      type: string
    type:
      type: string
    width:
      type: integer
      format: int32

CommoditySummaryItem:
  type: object
  properties:
    id:
      type: integer
      format: int64
    name:
      type: string
    hsn_sac_code:
      type: string
    unit_of_measurement:
      type: string
    gst_rate:
      type: number
      format: double
    cess_percentage:
      type: number
      format: double
      default: 0.0

CommoditySearchableField:
  type: string
  enum: [NAME, HSN_SAC_CODE]
