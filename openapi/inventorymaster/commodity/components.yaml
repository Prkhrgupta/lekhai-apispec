CommodityRequest:
  type: object
  required: [name]
  properties:
    name:
      type: string
    hsn_sac_code:
      type: string
    description:
      type: string
      description: Description for GSTR-1 / Eway Bill
    gst_rate_sale:
      type: number
      format: double
    gst_rate_purchase:
      type: number
      format: double
    unit_of_measurement:
      type: string
    sale_purchase_setting:
      type: boolean
      description: Whether sale/purchase ledger setting is enabled
    sale_ledger:
      $ref: '#/SaleLedgerRequest'
    purchase_ledger:
      $ref: '#/PurchaseLedgerRequest'

SaleLedgerRequest:
  type: object
  properties:
    in_state:
      $ref: '#/SaleInStateRequest'
    out_state:
      $ref: '#/SaleOutStateRequest'
    round_off:
      type: integer
      format: int64
      description: Round off ledger account ID

SaleInStateRequest:
  type: object
  properties:
    sale_account:
      type: integer
      format: int64
      description: Sale A/c (In-State) ledger ID
    cgst_percentage:
      type: number
      format: double
    cgst_account:
      type: integer
      format: int64
      description: CGST ledger account ID
    sgst_percentage:
      type: number
      format: double
    sgst_account:
      type: integer
      format: int64
      description: SGST ledger account ID
    cess_percentage:
      type: number
      format: double
    cess_account:
      type: integer
      format: int64
      description: CESS ledger account ID

SaleOutStateRequest:
  type: object
  properties:
    sale_account:
      type: integer
      format: int64
      description: Sale A/c (Out-State) ledger ID
    igst_percentage:
      type: number
      format: double
    igst_account:
      type: integer
      format: int64
      description: IGST ledger account ID
    cess_percentage:
      type: number
      format: double
    cess_account:
      type: integer
      format: int64
      description: CESS ledger account ID

PurchaseLedgerRequest:
  type: object
  properties:
    in_state:
      $ref: '#/PurchaseInStateRequest'
    out_state:
      $ref: '#/PurchaseOutStateRequest'

PurchaseInStateRequest:
  type: object
  properties:
    purchase_account:
      type: integer
      format: int64
      description: Purchase A/c (In-State) ledger ID
    cgst_percentage:
      type: number
      format: double
    cgst_account:
      type: integer
      format: int64
      description: CGST ledger account ID
    sgst_percentage:
      type: number
      format: double
    sgst_account:
      type: integer
      format: int64
      description: SGST ledger account ID
    cess_percentage:
      type: number
      format: double
    cess_account:
      type: integer
      format: int64
      description: CESS ledger account ID

PurchaseOutStateRequest:
  type: object
  properties:
    purchase_account:
      type: integer
      format: int64
      description: Purchase A/c (Out-State) ledger ID
    igst_percentage:
      type: number
      format: double
    igst_account:
      type: integer
      format: int64
      description: IGST ledger account ID
    cess_percentage:
      type: number
      format: double
    cess_account:
      type: integer
      format: int64
      description: CESS ledger account ID

CommodityResponse:
  type: object
  properties:
    id:
      type: integer
      format: int64
    name:
      type: string
    hsn_sac_code:
      type: string
    description:
      type: string
      description: Description for GSTR-1 / Eway Bill
    gst_rate_sale:
      type: number
      format: double
    gst_rate_purchase:
      type: number
      format: double
    unit_of_measurement:
      type: string
    sale_purchase_setting:
      type: boolean
    sale_ledger:
      $ref: '#/SaleLedgerResponse'
    purchase_ledger:
      $ref: '#/PurchaseLedgerResponse'
    is_active:
      type: boolean
    created_at:
      type: string
      format: date-time

SaleLedgerResponse:
  type: object
  properties:
    in_state:
      $ref: '#/SaleInStateResponse'
    out_state:
      $ref: '#/SaleOutStateResponse'
    round_off:
      type: integer
      format: int64

SaleInStateResponse:
  type: object
  properties:
    sale_account:
      type: integer
      format: int64
    cgst_percentage:
      type: number
      format: double
    cgst_account:
      type: integer
      format: int64
    sgst_percentage:
      type: number
      format: double
    sgst_account:
      type: integer
      format: int64
    cess_percentage:
      type: number
      format: double
    cess_account:
      type: integer
      format: int64

SaleOutStateResponse:
  type: object
  properties:
    sale_account:
      type: integer
      format: int64
    igst_percentage:
      type: number
      format: double
    igst_account:
      type: integer
      format: int64
    cess_percentage:
      type: number
      format: double
    cess_account:
      type: integer
      format: int64

PurchaseLedgerResponse:
  type: object
  properties:
    in_state:
      $ref: '#/PurchaseInStateResponse'
    out_state:
      $ref: '#/PurchaseOutStateResponse'

PurchaseInStateResponse:
  type: object
  properties:
    purchase_account:
      type: integer
      format: int64
    cgst_percentage:
      type: number
      format: double
    cgst_account:
      type: integer
      format: int64
    sgst_percentage:
      type: number
      format: double
    sgst_account:
      type: integer
      format: int64
    cess_percentage:
      type: number
      format: double
    cess_account:
      type: integer
      format: int64

PurchaseOutStateResponse:
  type: object
  properties:
    purchase_account:
      type: integer
      format: int64
    igst_percentage:
      type: number
      format: double
    igst_account:
      type: integer
      format: int64
    cess_percentage:
      type: number
      format: double
    cess_account:
      type: integer
      format: int64

CommoditySummaryResponse:
  type: object
  properties:
    columns:
      type: array
      items:
        $ref: '#/CommoditySummaryColumn'
    data:
      type: array
      items:
        $ref: '#/CommoditySummaryItem'

CommoditySummaryColumn:
  type: object
  properties:
    name:
      type: string
    type:
      type: string
    width:
      type: integer
      format: int32

CommoditySummaryItem:
  type: object
  properties:
    id:
      type: integer
      format: int64
    name:
      type: string
    hsn_sac_code:
      type: string
    unit_of_measurement:
      type: string
    gst_rate_sale:
      type: number
      format: double
    gst_rate_purchase:
      type: number
      format: double
