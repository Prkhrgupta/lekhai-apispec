paths:
  /commodity:
    post:
      tags: [Commodity]
      summary: Create commodity
      operationId: createCommodity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../commodity/components.yaml#/CommodityRequest'
      responses:
        '200':
          description: Commodity created
          content:
            application/json:
              schema:
                $ref: '../commodity/components.yaml#/CommodityResponse'
        '401':
          $ref: '../../common/components.yaml#/responses/UnauthorizedError'
        '403':
          $ref: '../../common/components.yaml#/responses/ForbiddenError'
        '500':
          $ref: '../../common/components.yaml#/responses/InternalServerError'
    get:
      tags: [Commodity]
      summary: List all commodities
      operationId: listCommodities
      responses:
        '200':
          description: List of commodities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../commodity/components.yaml#/CommodityResponse'
        '401':
          $ref: '../../common/components.yaml#/responses/UnauthorizedError'
        '403':
          $ref: '../../common/components.yaml#/responses/ForbiddenError'
        '500':
          $ref: '../../common/components.yaml#/responses/InternalServerError'
  /commodity/{id}:
    get:
      tags: [Commodity]
      summary: Get commodity by ID
      operationId: getCommodity
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Commodity details
          content:
            application/json:
              schema:
                $ref: '../commodity/components.yaml#/CommodityResponse'
        '401':
          $ref: '../../common/components.yaml#/responses/UnauthorizedError'
        '403':
          $ref: '../../common/components.yaml#/responses/ForbiddenError'
        '500':
          $ref: '../../common/components.yaml#/responses/InternalServerError'
    put:
      tags: [Commodity]
      summary: Update commodity
      operationId: updateCommodity
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../commodity/components.yaml#/CommodityRequest'
      responses:
        '200':
          description: Commodity updated
          content:
            application/json:
              schema:
                $ref: '../commodity/components.yaml#/CommodityResponse'
        '401':
          $ref: '../../common/components.yaml#/responses/UnauthorizedError'
        '403':
          $ref: '../../common/components.yaml#/responses/ForbiddenError'
        '500':
          $ref: '../../common/components.yaml#/responses/InternalServerError'
    delete:
      tags: [Commodity]
      summary: Delete commodity
      operationId: deleteCommodity
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Commodity deleted
        '401':
          $ref: '../../common/components.yaml#/responses/UnauthorizedError'
        '403':
          $ref: '../../common/components.yaml#/responses/ForbiddenError'
        '404':
          $ref: '../../common/components.yaml#/responses/NotFoundError'
        '500':
          $ref: '../../common/components.yaml#/responses/InternalServerError'
  /commodity/summary:
    get:
      tags: [Commodity]
      summary: Get commodity summary
      operationId: getCommoditySummaries
      x-spring-paginated: true
      parameters:
        - name: page
          in: query
          description: Zero-based page index
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
          required: false
        - name: size
          in: query
          description: Number of records per page
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
          required: false
        - name: sort
          in: query
          description: Sorting criteria in the format property(,asc|desc)
          schema:
            type: array
            items:
              type: string
          required: false
          explode: true
        - name: searchableField
          in: query
          description: Field to search/sort by
          schema:
            $ref: '../commodity/components.yaml#/CommoditySearchableField'
          required: false
        - name: searchText
          in: query
          description: Search query text
          schema:
            type: string
          required: false
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '../commodity/components.yaml#/CommoditySummaryResponse'
        '401':
          $ref: '../../common/components.yaml#/responses/UnauthorizedError'
        '403':
          $ref: '../../common/components.yaml#/responses/ForbiddenError'
        '500':
          $ref: '../../common/components.yaml#/responses/InternalServerError'
