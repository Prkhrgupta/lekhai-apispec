paths:
  /commodity:
    post:
      tags: [Commodity]
      summary: Create commodity
      operationId: createCommodity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../commodity/components.yaml#/CommodityRequest'
      responses:
        '200':
          description: Commodity created
          content:
            application/json:
              schema:
                $ref: '../commodity/components.yaml#/CommodityResponse'
        '401':
          $ref: '../../common/components.yaml#/responses/UnauthorizedError'
        '403':
          $ref: '../../common/components.yaml#/responses/ForbiddenError'
        '500':
          $ref: '../../common/components.yaml#/responses/InternalServerError'
    get:
      tags: [Commodity]
      summary: List all commodities
      operationId: listCommodities
      responses:
        '200':
          description: List of commodities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../commodity/components.yaml#/CommodityResponse'
        '401':
          $ref: '../../common/components.yaml#/responses/UnauthorizedError'
        '403':
          $ref: '../../common/components.yaml#/responses/ForbiddenError'
        '500':
          $ref: '../../common/components.yaml#/responses/InternalServerError'
  /commodity/{id}:
    get:
      tags: [Commodity]
      summary: Get commodity by ID
      operationId: getCommodity
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Commodity details
          content:
            application/json:
              schema:
                $ref: '../commodity/components.yaml#/CommodityResponse'
        '401':
          $ref: '../../common/components.yaml#/responses/UnauthorizedError'
        '403':
          $ref: '../../common/components.yaml#/responses/ForbiddenError'
        '500':
          $ref: '../../common/components.yaml#/responses/InternalServerError'
    put:
      tags: [Commodity]
      summary: Update commodity
      operationId: updateCommodity
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../commodity/components.yaml#/CommodityRequest'
      responses:
        '200':
          description: Commodity updated
          content:
            application/json:
              schema:
                $ref: '../commodity/components.yaml#/CommodityResponse'
        '401':
          $ref: '../../common/components.yaml#/responses/UnauthorizedError'
        '403':
          $ref: '../../common/components.yaml#/responses/ForbiddenError'
        '500':
          $ref: '../../common/components.yaml#/responses/InternalServerError'
  /commodity/summary:
    get:
      tags: [Commodity]
      summary: Get commodity summary
      operationId: getCommoditySummaries
      responses:
        '200':
          description: Commodity summary response
          content:
            application/json:
              schema:
                $ref: '../commodity/components.yaml#/CommoditySummaryResponse'
        '401':
          $ref: '../../common/components.yaml#/responses/UnauthorizedError'
        '403':
          $ref: '../../common/components.yaml#/responses/ForbiddenError'
        '500':
          $ref: '../../common/components.yaml#/responses/InternalServerError'
