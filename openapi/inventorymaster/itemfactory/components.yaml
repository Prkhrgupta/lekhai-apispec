ItemFactoryRequest:
  type: object
  required: [name]
  properties:
    name:
      type: string
      example: Spinning Unit
    percentage:
      type: number
      format: double
      default: 0.0
      example: 2.5

ItemFactoryResponse:
  type: object
  properties:
    id:
      type: integer
      format: int64
    name:
      type: string
      example: Spinning Unit
    percentage:
      type: number
      format: double
      example: 2.5

ItemFactorySearchableField:
  type: string
  enum: [NAME]

ItemFactorySummaryPageResponse:
  type: object
  properties:
    data:
      type: array
      items:
        $ref: '#/ItemFactoryResponse'
    pagination:
      $ref: '../../common/components.yaml#/PaginationMeta'
