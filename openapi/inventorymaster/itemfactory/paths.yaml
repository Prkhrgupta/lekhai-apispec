paths:
  /item-factory:
    post:
      tags: [ItemFactory]
      summary: Create item factory
      operationId: createItemFactory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../itemfactory/components.yaml#/ItemFactoryRequest'
      responses:
        '201':
          description: Item factory created
          content:
            application/json:
              schema:
                $ref: '../itemfactory/components.yaml#/ItemFactoryResponse'
        '401':
          $ref: '../../common/components.yaml#/responses/UnauthorizedError'
        '403':
          $ref: '../../common/components.yaml#/responses/ForbiddenError'
        '500':
          $ref: '../../common/components.yaml#/responses/InternalServerError'
    get:
      tags: [ItemFactory]
      summary: get item factory options for dropdown
      operationId: getItemFactoryDropdownOptions
      responses:
        '200':
          description: Dropdown options for item factory
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../../common/components.yaml#/DropdownItem'
        '401':
          $ref: '../../common/components.yaml#/responses/UnauthorizedError'
        '403':
          $ref: '../../common/components.yaml#/responses/ForbiddenError'
        '500':
          $ref: '../../common/components.yaml#/responses/InternalServerError'
  /item-factory/{id}:
    get:
      tags: [ItemFactory]
      summary: Get item factory by ID
      operationId: getItemFactory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Item factory details
          content:
            application/json:
              schema:
                $ref: '../itemfactory/components.yaml#/ItemFactoryResponse'
        '401':
          $ref: '../../common/components.yaml#/responses/UnauthorizedError'
        '403':
          $ref: '../../common/components.yaml#/responses/ForbiddenError'
        '404':
          $ref: '../../common/components.yaml#/responses/NotFoundError'
        '500':
          $ref: '../../common/components.yaml#/responses/InternalServerError'
    put:
      tags: [ItemFactory]
      summary: Update item factory
      operationId: updateItemFactory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../itemfactory/components.yaml#/ItemFactoryRequest'
      responses:
        '200':
          description: Item factory updated
          content:
            application/json:
              schema:
                $ref: '../itemfactory/components.yaml#/ItemFactoryResponse'
        '401':
          $ref: '../../common/components.yaml#/responses/UnauthorizedError'
        '403':
          $ref: '../../common/components.yaml#/responses/ForbiddenError'
        '404':
          $ref: '../../common/components.yaml#/responses/NotFoundError'
        '500':
          $ref: '../../common/components.yaml#/responses/InternalServerError'
    delete:
      tags: [ItemFactory]
      summary: Delete item factory
      operationId: deleteItemFactory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Item factory deleted
        '401':
          $ref: '../../common/components.yaml#/responses/UnauthorizedError'
        '403':
          $ref: '../../common/components.yaml#/responses/ForbiddenError'
        '404':
          $ref: '../../common/components.yaml#/responses/NotFoundError'
        '500':
          $ref: '../../common/components.yaml#/responses/InternalServerError'
  /item-factory/summary:
    get:
      tags: [ItemFactory]
      summary: Get item factory summary
      operationId: getItemFactorySummaries
      x-spring-paginated: true
      parameters:
        - name: page
          in: query
          description: Zero-based page index
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
          required: false
        - name: size
          in: query
          description: Number of records per page
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
          required: false
        - name: sort
          in: query
          description: Sorting criteria in the format property(,asc|desc)
          schema:
            type: array
            items:
              type: string
          required: false
          explode: true
        - name: searchableField
          in: query
          description: Field to search by
          schema:
            $ref: '../itemfactory/components.yaml#/ItemFactorySearchableField'
          required: false
        - name: searchText
          in: query
          description: Search query text
          schema:
            type: string
          required: false
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '../itemfactory/components.yaml#/ItemFactorySummaryPageResponse'
        '401':
          $ref: '../../common/components.yaml#/responses/UnauthorizedError'
        '403':
          $ref: '../../common/components.yaml#/responses/ForbiddenError'
        '500':
          $ref: '../../common/components.yaml#/responses/InternalServerError'
