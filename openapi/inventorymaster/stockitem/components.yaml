FinishedRawMaterial:
  type: string
  enum: [FINISHED, RAW]

StockItemRequest:
  type: object
  description: >-
    Primary UOM is the stock and rate unit of the item. Alternate UOM is an
    optional packing/display unit. Cross-field rules: when alternateUomId is
    absent, conversionFactor must be absent; when alternateUomId is present,
    conversionFactor must be positive and alternateUomId must differ from
    primaryUomId. Rates and opening values are always denominated in the
    Primary UOM; the Alternate quantity is derived at runtime and never stored.
  required: [itemName, primaryUomId]
  properties:
    finishedRawMaterial:
      $ref: '#/FinishedRawMaterial'
    itemCategoryId:
      type: integer
      format: int64
    itemFactoryId:
      type: integer
      format: int64
    itemName:
      type: string
      example: Cotton Shirt
    purchasePrice:
      type: number
      format: double
      default: 0.0
    salePrice:
      type: number
      format: double
      default: 0.0
    commodityId:
      type: integer
      format: int64
    primaryUomId:
      type: integer
      format: int64
      description: Primary UOM of the item; stock and rate unit.
    alternateUomId:
      type: integer
      format: int64
      description: Optional Alternate UOM; must differ from primaryUomId when present.
    conversionFactor:
      type: number
      format: double
      exclusiveMinimum: 0
      description: How many Alternate units sit inside 1 Primary unit. Required and positive when alternateUomId is present; absent otherwise.
    openingQty:
      type: number
      format: double
      default: 0.0
      description: Opening stock entered once in the Primary unit.
    openingRate:
      type: number
      format: double
      default: 0.0
    openingValue:
      type: number
      format: double
      default: 0.0

StockItemResponse:
  type: object
  properties:
    id:
      type: integer
      format: int64
    finishedRawMaterial:
      $ref: '#/FinishedRawMaterial'
    itemCategoryId:
      type: integer
      format: int64
    itemCategoryName:
      type: string
    itemFactoryId:
      type: integer
      format: int64
    itemFactoryName:
      type: string
    itemName:
      type: string
      example: Cotton Shirt
    purchasePrice:
      type: number
      format: double
    salePrice:
      type: number
      format: double
    commodityId:
      type: integer
      format: int64
    commodityName:
      type: string
    hsnCode:
      type: string
    gstPercentage:
      type: number
      format: double
    primaryUomId:
      type: integer
      format: int64
    primaryUomName:
      type: string
    primaryQuantityCode:
      $ref: '../uom/components.yaml#/Uqc'
    alternateUomId:
      type: integer
      format: int64
    alternateUomName:
      type: string
    alternateQuantityCode:
      $ref: '../uom/components.yaml#/Uqc'
    conversionFactor:
      type: number
      format: double
    openingQty:
      type: number
      format: double
    openingRate:
      type: number
      format: double
    openingValue:
      type: number
      format: double

StockItemSearchableField:
  type: string
  enum: [NAME]

StockItemSummaryPageResponse:
  type: object
  properties:
    data:
      type: array
      items:
        $ref: '#/StockItemResponse'
    pagination:
      $ref: '../../common/components.yaml#/PaginationMeta'
