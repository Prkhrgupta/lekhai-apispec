paths:
  /stock-item:
    post:
      tags: [StockItem]
      summary: Create stock item
      operationId: createStockItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../stockitem/components.yaml#/StockItemRequest'
      responses:
        '201':
          description: Stock item created
          content:
            application/json:
              schema:
                $ref: '../stockitem/components.yaml#/StockItemResponse'
        '401':
          $ref: '../../common/components.yaml#/responses/UnauthorizedError'
        '403':
          $ref: '../../common/components.yaml#/responses/ForbiddenError'
        '500':
          $ref: '../../common/components.yaml#/responses/InternalServerError'
    get:
      tags: [StockItem]
      summary: get stock item options for dropdown
      operationId: getStockItemDropdownOptions
      responses:
        '200':
          description: Dropdown options for stock item
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../../common/components.yaml#/DropdownItem'
        '401':
          $ref: '../../common/components.yaml#/responses/UnauthorizedError'
        '403':
          $ref: '../../common/components.yaml#/responses/ForbiddenError'
        '500':
          $ref: '../../common/components.yaml#/responses/InternalServerError'
  /stock-item/{id}:
    get:
      tags: [StockItem]
      summary: Get stock item by ID
      operationId: getStockItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Stock item details
          content:
            application/json:
              schema:
                $ref: '../stockitem/components.yaml#/StockItemResponse'
        '401':
          $ref: '../../common/components.yaml#/responses/UnauthorizedError'
        '403':
          $ref: '../../common/components.yaml#/responses/ForbiddenError'
        '404':
          $ref: '../../common/components.yaml#/responses/NotFoundError'
        '500':
          $ref: '../../common/components.yaml#/responses/InternalServerError'
    put:
      tags: [StockItem]
      summary: Update stock item
      operationId: updateStockItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../stockitem/components.yaml#/StockItemRequest'
      responses:
        '200':
          description: Stock item updated
          content:
            application/json:
              schema:
                $ref: '../stockitem/components.yaml#/StockItemResponse'
        '401':
          $ref: '../../common/components.yaml#/responses/UnauthorizedError'
        '403':
          $ref: '../../common/components.yaml#/responses/ForbiddenError'
        '404':
          $ref: '../../common/components.yaml#/responses/NotFoundError'
        '500':
          $ref: '../../common/components.yaml#/responses/InternalServerError'
    delete:
      tags: [StockItem]
      summary: Delete stock item
      operationId: deleteStockItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Stock item deleted
        '401':
          $ref: '../../common/components.yaml#/responses/UnauthorizedError'
        '403':
          $ref: '../../common/components.yaml#/responses/ForbiddenError'
        '404':
          $ref: '../../common/components.yaml#/responses/NotFoundError'
        '500':
          $ref: '../../common/components.yaml#/responses/InternalServerError'
  /stock-item/summary:
    get:
      tags: [StockItem]
      summary: Get stock item summary
      operationId: getStockItemSummaries
      x-spring-paginated: true
      parameters:
        - name: page
          in: query
          description: Zero-based page index
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
          required: false
        - name: size
          in: query
          description: Number of records per page
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
          required: false
        - name: sort
          in: query
          description: Sorting criteria in the format property(,asc|desc)
          schema:
            type: array
            items:
              type: string
          required: false
          explode: true
        - name: searchableField
          in: query
          description: Field to search by
          schema:
            $ref: '../stockitem/components.yaml#/StockItemSearchableField'
          required: false
        - name: searchText
          in: query
          description: Search query text
          schema:
            type: string
          required: false
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '../stockitem/components.yaml#/StockItemSummaryPageResponse'
        '401':
          $ref: '../../common/components.yaml#/responses/UnauthorizedError'
        '403':
          $ref: '../../common/components.yaml#/responses/ForbiddenError'
        '500':
          $ref: '../../common/components.yaml#/responses/InternalServerError'
