        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    DropdownItem:
      type: object
      required:
        - label
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier for the dropdown option
          example: 1
        label:
          type: string
          description: Display text for the dropdown option
          example: Option 1
        code:
          type: string
          description: generic Unique identifier, if id is not applicable
          example: JP
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: null
        data:
          type: object
        error:
          type: string
          example: Unexpected error
        timestamp:
          type: string
          format: date-time
    AccountGroupRequest:
      type: object
      required:
        - name
        - parentId
      properties:
        name:
          type: string
          example: Fixed Assets
        parentId:
          type: integer
          format: int64
          example: 5
    AccountGroupResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          example: Sundry Creditor
    AccountGroupSearchableField:
      type: string
      enum:
        - NAME
    AccountGroupSummaryItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    PaginationMeta:
      type: object
      properties:
        totalPages:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
    AccountGroupSummaryPageResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AccountGroupSummaryItem'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
    AreaRequest:
      type: object
      required:
        - areaName
      properties:
        areaName:
          type: string
          example: Kanpur
    AreaResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        areaName:
          type: string
          example: Kanpur
    AreaSearchableField:
      type: string
      enum:
        - NAME
    AreaSummaryPageResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AreaResponse'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
    BrokerRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: Rajesh Kumar
        phone:
          type: string
          example: '9876543210'
    BrokerResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          example: Rajesh Kumar
        phone:
          type: string
          example: '9876543210'
    BrokerSearchableField:
      type: string
      enum:
        - NAME
    BrokerSummaryPageResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BrokerResponse'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
    AccountEntryType:
      type: string
      enum:
        - DR
        - CR
    MailTo:
      type: object
      properties:
        mail_to_line_1:
          type: string
        mail_to_line_2:
          type: string
        mail_to_line_3:
          type: string
    RegistrationType:
      type: string
      enum:
        - COMPOSITION
        - CUSTOMER
        - REGULAR
        - UNREGISTERED
    PartyType:
      type: string
      enum:
        - NOT_APPLICABLE
        - DEEMED_EXPORT
        - GOVERNMENT_ENTITY
        - SEZ
    GstInDetail:
      type: object
      properties:
        registration_type:
          $ref: '#/components/schemas/RegistrationType'
        is_e_commerce_operator:
          type: boolean
        gst_in_uin:
          type: string
        party_type:
          $ref: '#/components/schemas/PartyType'
    DeducteeType:
      type: string
      enum:
        - INDIVIDUAL_HUF
        - OTHERS
      description: Deductee status; some TDS sections (e.g. 194C) apply a different rate to individuals/HUFs
    LedgerRequest:
      type: object
      required:
        - name
      properties:
        gst_in_number:
          type: string
        name:
          type: string
        account_group:
          type: integer
          format: int64
        opening_balance:
          type: number
        account_entry_type:
          $ref: '#/components/schemas/AccountEntryType'
        legal_name:
          type: string
        Location:
          type: string
        country_name:
          type: string
        state_and_code:
          type: string
        mail_to:
          $ref: '#/components/schemas/MailTo'
        area_id:
          type: integer
          format: int64
        contact_person:
          type: string
        phone_number:
          type: integer
          format: int64
        pan:
          type: string
        credit_limit:
          type: number
        transport_id:
          type: integer
          format: int64
        tan_number:
          type: string
        broker_id:
          type: integer
          format: int64
        gstInDetailsPresent:
          type: boolean
        gst_in_details:
          $ref: '#/components/schemas/GstInDetail'
        aadhaar_number:
          type: string
        image_uploaded:
          type: boolean
        email:
          type: string
        msme_number:
          type: string
        distance:
          type: number
          format: double
        pin_code:
          type: string
        city:
          type: string
        tds_applicable:
          type: boolean
          default: false
          description: Whether TDS is deducted on payments/credits to this party
        tds_section_id:
          type: integer
          format: int64
          description: Default TDS section (nature of payment) for this party
        deductee_type:
          $ref: '#/components/schemas/DeducteeType'
        ldc_certificate_number:
          type: string
          description: Lower/nil deduction certificate number
        ldc_rate:
          type: number
          format: double
          description: TDS rate allowed by the lower deduction certificate
        ldc_valid_from:
          type: string
          format: date
        ldc_valid_to:
          type: string
          format: date
    LedgerArea:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        state_code:
          type: string
    LedgerBroker:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        phone:
          type: string
    LedgerTransport:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        phone:
          type: string
        gst:
          type: string
    GstInDetailResponse:
      type: object
      properties:
        registration_type:
          $ref: '#/components/schemas/RegistrationType'
        is_e_commerce_operator:
          type: boolean
        gst_in_uin:
          type: string
        party_type:
          $ref: '#/components/schemas/PartyType'
    LedgerAddress:
      type: object
      properties:
        address_line_1:
          type: string
        address_line_2:
          type: string
        address_line_3:
          type: string
        city:
          type: string
        state_id:
          type: string
        area_id:
          type: integer
          format: int64
        pincode:
          type: string
        distance:
          type: number
    LedgerResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        legal_name:
          type: string
        account_group_id:
          type: integer
          format: int64
        opening_balance:
          type: number
        opening_balance_type:
          $ref: '#/components/schemas/AccountEntryType'
        credit_limit:
          type: number
        pan:
          type: string
        aadhaar:
          type: string
        tan:
          type: string
        email:
          type: string
        msme:
          type: string
        contact_person:
          type: string
        phone_number:
          type: integer
          format: int64
        gst_in_number:
          type: string
        location:
          type: string
        is_active:
          type: boolean
        area:
          $ref: '#/components/schemas/LedgerArea'
        broker:
          $ref: '#/components/schemas/LedgerBroker'
        transport:
          $ref: '#/components/schemas/LedgerTransport'
        gstin_details:
          $ref: '#/components/schemas/GstInDetailResponse'
        address:
          $ref: '#/components/schemas/LedgerAddress'
        tds_applicable:
          type: boolean
        tds_section_id:
          type: integer
          format: int64
        tds_section_label:
          type: string
        deductee_type:
          $ref: '#/components/schemas/DeducteeType'
        ldc_certificate_number:
          type: string
        ldc_rate:
          type: number
          format: double
        ldc_valid_from:
          type: string
          format: date
        ldc_valid_to:
          type: string
          format: date
        created_at:
          type: string
          format: date-time
    LedgerBalanceResponse:
      type: object
      properties:
        ledger_id:
          type: integer
          format: int64
        current_balance:
          type: number
        current_balance_type:
          $ref: '#/components/schemas/AccountEntryType'
        debit_amount:
          type: number
        credit_amount:
          type: number
    LedgerSearchableField:
      type: string
      enum:
        - NAME
        - AREA
    LedgerSummaryItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        state:
          type: string
        area:
          type: string
        accountGroup:
          type: string
        gstin:
          type: string
    LedgerSummaryPageResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/LedgerSummaryItem'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
    SaleType:
      type: string
      enum:
        - IN_STATE
        - OUT_STATE
        - EXPORT_WITH_IGST
        - EXPORT_UNDER_LUT
        - SEZ_WITH_IGST
        - SEZ_UNDER_LUT
      description: |
