openapi: 3.0.3
info:
  title: Lekhai API
  description: API specification for Lekhai backend services
  version: 1.1.4
servers:
  - url: http://localhost:8080
    description: Local dev server
  - url: https://lekhai.sitswiftcloud.in
    description: UAT server
security:
  - bearerAuth: []
tags:
  - name: Lekhai
    description: Lekhai APIs
paths:
  /account-group:
    post:
      tags:
        - Account Group
      summary: Create account group
      operationId: createAccountGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountGroupRequest'
      responses:
        '200':
          description: Account group created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountGroupResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags:
        - Account Group
      summary: Get account group options for a dropdown
      operationId: getAccountGroupDropdownOptions
      responses:
        '200':
          description: Dropdown options for account groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DropdownItem'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /account-group/summary:
    get:
      tags:
        - Account Group
      summary: Get account group summary
      operationId: getAccountGroupSummaries
      x-spring-paginated: true
      parameters:
        - name: page
          in: query
          description: Zero-based page index
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
          required: false
        - name: size
          in: query
          description: Number of records per page
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
          required: false
        - name: sort
          in: query
          description: Sorting criteria in the format property(,asc|desc)
          schema:
            type: array
            items:
              type: string
          required: false
          explode: true
        - name: searchableField
          in: query
          description: Field to search by
          schema:
            $ref: '#/components/schemas/AccountGroupSearchableField'
          required: false
        - name: searchText
          in: query
          description: Search query text
          schema:
            type: string
          required: false
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountGroupSummaryPageResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'
