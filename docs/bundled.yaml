                  $ref: '#/components/schemas/EwbSummary'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /transporter/ewb/expiring:
    get:
      tags:
        - Transporter EWB
      summary: Get EWBs expiring today, tomorrow, or day after
      operationId: getEwbExpiring
