  /account-ledger/{ledgerId}:
    get:
      tags:
        - AccountLedger
      summary: Get account ledger entries
      operationId: getAccountLedgerEntries
      x-spring-paginated: true
      parameters:
        - name: ledgerId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: page
          in: query
          description: Zero-based page index
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
          required: false
        - name: size
          in: query
          description: Number of records per page
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
          required: false
        - name: sort
          in: query
          description: Sorting criteria in the format property(,asc|desc)
          schema:
            type: array
            items:
              type: string
          required: false
          explode: true
        - name: fromDate
          in: query
          description: Filter entries from this date (inclusive)
          schema:
            type: string
            format: date
          required: false
        - name: toDate
          in: query
          description: Filter entries up to this date (inclusive)
          schema:
            type: string
            format: date
          required: false
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountLedgerPageResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /login:
    get:
      tags:
        - Auth
      summary: Login to the application
      operationId: login
      description: Authenticates the user using Basic Authentication and returns a JWT token or a list of shops if multiple are available.
      security:
        - basicAuth: []
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/shop-token:
    get:
      tags:
        - Auth
      summary: Get token for Shop Code
      operationId: generateTokenForShopCode
      description: Authenticates the user using a JWT token and a shop code provided in the header.
      parameters:
        - name: shopcode
          in: header
          required: true
          description: The code of the shop to login to.
          schema:
            type: integer
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /menu:
